# The Rust client: reads the shipped translation files, nothing else. No dependencies.
[package]
name = "rcinel-translate"
# The release version. Must match <Version> in dotnet/Directory.Build.props and the other clients;
# CI checks all of them against each other and against the vX.Y.Z tag.
version = "0.1.0"
edition = "2021"
# OnceLock is the newest std item used.
rust-version = "1.70"
description = "Loads a translation set for a language and translates with translate(\"UUIDv7\", \"English text\"). No dependencies."
license = "MIT"
authors = ["CodeIsNotEvil"]
repository = "https://github.com/CodeIsNotEvil/RcinelTranslate"
homepage = "https://github.com/CodeIsNotEvil/RcinelTranslate"
readme = "README.md"
keywords = ["translation", "localization", "i18n", "l10n", "uuidv7"]
categories = ["internationalization", "localization"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
# Only to read spec/fixtures/cases.json in the tests; the library itself has no dependencies.
serde_json = "1"
