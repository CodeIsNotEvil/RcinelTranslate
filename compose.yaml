# The translation editor on http://localhost:8080 (or RCINEL_PORT), editing the project folder
# RCINEL_PROJECT (default: the demo). Run it with `podman compose up -d --build`; docker compose
# works the same. Settings go in a .env file next to this one, see .env.example.
services:
  editor:
    build:
      context: ./dotnet
      dockerfile: src/Editor/Dockerfile
    image: localhost/rcinel-translate-editor:latest
    # Rootless Podman maps root in the container to your own user, so files the editor writes into
    # the project belong to you. Under Docker, set RCINEL_USER to "$(id -u):$(id -g)" for the same.
    user: "${RCINEL_USER:-0:0}"
    ports:
      # A high host port: rootless Podman can't bind ports below 1024.
      - "${RCINEL_PORT:-8080}:8080"
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      Rcinel__AdminUser: "${RCINEL_ADMIN_USER:-}"
      Rcinel__AdminPassword: "${RCINEL_ADMIN_PASSWORD:-}"
    volumes:
      # The i18n folder of your app's git checkout: the editor reads and writes it directly, and you
      # commit the changes like any other.
      - "${RCINEL_PROJECT:-./samples/demo/i18n}:/project"
      - editor-data:/data
    restart: unless-stopped

volumes:
  editor-data:
